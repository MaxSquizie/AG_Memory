org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Kotlin daemon often dies on Synology Drive / network folders (exit 0 after "ready").
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.vfs.watch=false
# Chaquopy/Gradle snapshots fail on Synology Drive placeholders ("not a regular file").
# Build outputs go to %LOCALAPPDATA%\AHMemory\android-build\ (see android/build.gradle.kts).
