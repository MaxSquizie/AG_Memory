name: temp-document-tests

on:
  push:
    branches: [temp]

jobs:
  document-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-subtests
      - name: Run stream B tests
        run: |
          pytest -q \
            tests/test_document_*.py \
            tests/test_v4_source_projection_2100.py \
            tests/test_gui_metrics_documents_02522.py
