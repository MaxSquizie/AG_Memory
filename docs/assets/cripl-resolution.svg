<text x="401" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#183D32">твой</text>
<rect x="700" y="120" width="298" height="67" rx="4" fill="#FFFFFF" stroke="#AFBAB0" stroke-width="2"/>
<text x="849" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#183D32">ИИ ассистент</text>
