<path d="M401 195 V280" fill="none" stroke="#267653" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<rect x="41" y="289" width="233" height="67" rx="4" fill="#FFFFFF" stroke="#AFBAB0" stroke-width="2"/>
<text x="157" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#183D32">говорящий</text>
