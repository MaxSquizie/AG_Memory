<rect x="738" y="289" width="231" height="67" rx="4" fill="#F0E0C5" stroke="none" stroke-width="2"/>
<text x="853" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#8F632A">Крипл</text>
