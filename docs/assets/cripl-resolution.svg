<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="425" viewBox="0 0 1100 425" role="img" aria-labelledby="title desc"><title id="title">Кандидаты связей в именной конструкции</title><desc id="desc">Слова «Я» и «твой» связываются с явно заданными участниками контекста. «Твой» согласуется с именной группой. Пунктиром показано ещё проверяемое присоединение «Крипл».</desc><defs><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#267653" stroke-width="2" stroke-linejoin="round"/></marker><marker id="grey-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#55645C" stroke-width="2" stroke-linejoin="round"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8F632A" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1100" height="425" fill="#F7F6F1"/>
<path d="M116 113 V64 H836 V113" fill="none" stroke="#AFBAB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
