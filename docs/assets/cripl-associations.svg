<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 721" width="1500" height="721" role="img" aria-labelledby="tit desc">
<title id="tit">Фрагмент ассоциативно-гетерархической памяти</title><desc id="desc">Реплика Крипл соединена с упоминаниями роли, адресата и речевого акта, показана условная активация на вопрос об имени</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#388264" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#9DB0A8" stroke-width="1.5"/></marker></defs>
<rect width="1500" height="721" fill="#F7F9F7"/>
<rect x="24" y="24" width="1452" height="673" rx="22" fill="white" stroke="#D8E5DE" stroke-width="2"/>
<text x="68" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700" fill="#273B33" >Связи в памяти и их активация</text><text x="68" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#556C61" >Схематичный фрагмент после реплики Крипл; яркость показывает актуальность при запросе об имени.</text><rect x="58" y="289" width="291" height="101" rx="13" fill="#E2F2E8" stroke="#3D9870" stroke-width="2"/><text x="79" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#186745" >Вопрос</text><text x="79" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#5B7165" >Как тебя зовут?</text><rect x="511" y="271" width="283" height="110" rx="13" fill="#E2F2E8" stroke="#3D9870" stroke-width="2"/><text x="532" y="314" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#186745" >Крипл</text><text x="532" y="347" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#5B7165" >названное имя</text><rect x="1072" y="171" width="344" height="105" rx="13" fill="#FFFFFF" stroke="#BDCEC5" stroke-width="2"/><text x="1093" y="214" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#283C32" >ИИ-ассистент</text><text x="1093" y="247" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#5B7165" >названная роль</text><rect x="1072" y="341" width="344" height="105" rx="13" fill="#FFFFFF" stroke="#BDCEC5" stroke-width="2"/><text x="1093" y="384" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#283C32" >Пользователь</text><text x="1093" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#5B7165" >адресат реплики</text><rect x="1057" y="502" width="359" height="105" rx="13" fill="#FFFFFF" stroke="#BDCEC5" stroke-width="2"/><text x="1078" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#283C32" >Приветствие</text><text x="1078" y="578" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#5B7165" >часть речевого события</text><rect x="524" y="502" width="270" height="105" rx="13" fill="#E2F2E8" stroke="#3D9870" stroke-width="2"/><text x="545" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#186745" >Реплика</text><text x="545" y="578" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#5B7165" >источник сообщения</text><path d="M354 339H500" fill="none" stroke="#388264" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M655 385V489" fill="none" stroke="#388264" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M797 306C924 306 921 223 1062 223" fill="none" stroke="#A9B9B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><path d="M798 326C923 326 939 396 1062 396" fill="none" stroke="#A9B9B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><path d="M801 552H1045" fill="none" stroke="#A9B9B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray-arrow)"/><circle cx="423" cy="339" r="7" fill="#3D9870"/><circle cx="655" cy="448" r="7" fill="#3D9870"/><text x="860" y="288" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#758B7E" >роль</text><text x="872" y="389" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#758B7E" >обращение</text><text x="859" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#758B7E" >речевой акт</text><text x="72" y="674" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#536D60" >Актуальное имя можно извлечь только при подтверждённой привязке к говорящему.</text>
</svg>