<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">Утверждение в гиперграфе и распространение возбуждения</title><desc id="desc">N представляет разрешённое отношение и связывает говорящего с адресатом через роли выбранного шаблона T. Поддержка исходной репликой показана отдельно. Зелёные стрелки изображают условное распространение возбуждения от адресата к отношению и говорящему; серый N — другое утверждение с общим участником.</desc><defs><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#267653" stroke-width="2" stroke-linejoin="round"/></marker><marker id="grey-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#55645C" stroke-width="2" stroke-linejoin="round"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8F632A" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1100" height="600" fill="#F7F6F1"/>
<text x="40" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#183D32">Сохранённое отношение</text>
<text x="40" y="83" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#55645C">Ядро фразы «Я — твой ИИ ассистент»</text>
