<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="530" viewBox="0 0 1328 530" role="img" aria-labelledby="t d"><title id="t">Возможная каноническая связь говорящего с ролью и именем</title><desc id="d">Упрощённая концептуальная схема. Все переходы требуют соответствующих ресурсов и проверок.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#478E71" stroke-width="1.5"/></marker></defs><rect width="1328" height="530" fill="#F7FAF8"/><text x="40" y="56" font-size="30" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">Связи при успешной интерпретации и записи</text><text x="40" y="91" font-size="18" font-weight="400" fill="#596E63" font-family="DejaVu Sans,Arial,sans-serif">Иллюстрация условна: фактическая структура определяется ресурсами и канонической привязкой.</text><rect x="64" y="144" width="230" height="95" rx="12" fill="#E8F5EB" stroke="#B6CBC0" stroke-width="2"/><text x="88" y="186" font-size="23" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">Говорящий</text><text x="88" y="218" font-size="16" font-weight="400" fill="#526B5F" font-family="DejaVu Sans,Arial,sans-serif">self_ref из контекста</text><rect x="518" y="141" width="250" height="101" rx="12" fill="#E8F5EB" stroke="#B6CBC0" stroke-width="2"/><text x="539" y="185" font-size="20" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">N: роль говорящего</text><text x="539" y="219" font-size="17" font-weight="400" fill="#526B5F" font-family="DejaVu Sans,Arial,sans-serif">только при RESOLVED</text><rect x="1025" y="147" width="242" height="90" rx="12" fill="#FFFFFF" stroke="#B6CBC0" stroke-width="2"/><text x="1046" y="185" font-size="21" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">«ИИ-ассистент»</text><text x="1046" y="215" font-size="16" font-weight="400" fill="#526B5F" font-family="DejaVu Sans,Arial,sans-serif">смысловой кандидат</text><rect x="518" y="332" width="250" height="92" rx="12" fill="#FFFFFF" stroke="#B6CBC0" stroke-width="2"/><text x="542" y="371" font-size="23" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">«Крипл»</text><text x="542" y="401" font-size="16" font-weight="400" fill="#526B5F" font-family="DejaVu Sans,Arial,sans-serif">упоминание имени</text><rect x="64" y="329" width="230" height="96" rx="12" fill="#FFFFFF" stroke="#B6CBC0" stroke-width="2"/><text x="87" y="373" font-size="23" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">Адресат</text><text x="87" y="405" font-size="16" font-weight="400" fill="#526B5F" font-family="DejaVu Sans,Arial,sans-serif">user_ref из контекста</text><path d="M296 195 L514 192" stroke="#478E71" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><path d="M772 193 L1020 193" stroke="#478E71" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><path d="M656 246 L656 329" stroke="#478E71" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><text x="685" y="298" font-size="16" font-weight="400" fill="#526B5F" font-family="DejaVu Sans,Arial,sans-serif">связь имени — если обоснована</text><path d="M297 378 L512 227" stroke="#478E71" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#arr)"/><rect x="1026" y="319" width="242" height="108" rx="12" fill="#E8F5EB" stroke="#B6CBC0" stroke-width="2"/><text x="1049" y="361" font-size="23" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">Опора O</text><text x="1049" y="390" font-size="16" font-weight="400" fill="#526B5F" font-family="DejaVu Sans,Arial,sans-serif">исходное утверждение</text><path d="M1024 364 L773 228" stroke="#478E71" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><text x="41" y="489" font-size="18" font-weight="400" fill="#596E63" font-family="DejaVu Sans,Arial,sans-serif">«Привет» остаётся частью исходной строки; отдельная семантика речевого акта требует ресурса.</text></svg>