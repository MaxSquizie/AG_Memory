<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="ttl ds">
<title id="ttl">АГ-память как гиперграф с уровнями возбуждения и путём вывода</title>
<desc id="ds">Поле связанных сущностей и утверждений. В уже существующий фрагмент памяти о станции, роботе и клапане встроено новое наблюдение о падении давления. Возбуждение от запроса проходит по связям, выделяя правило и событие, после чего строится условный вывод с тремя основаниями.</desc>
<defs>
<pattern id="bg" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#47665A" stroke-width=".65" opacity=".27"/></pattern>
<linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#142B26"/><stop offset="1" stop-color="#0E201E"/></linearGradient>
<linearGradient id="green" x1="0" x2="1"><stop stop-color="#CDF4C5"/><stop offset="1" stop-color="#6DCAB3"/></linearGradient>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowBig" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="19" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="mintArr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#75CCAE" stroke-width="1.7"/></marker>
<marker id="goldArr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#F0BA73" stroke-width="1.7"/></marker>
<style>
text{font-family:'DejaVu Sans','Arial',sans-serif}
.head{font-size:40px;font-weight:700;fill:#F2F0DC}
.sub{font-size:23px;fill:#A5BEB4}
.eyebrow{font-size:19px;font-weight:700;fill:#A8D4BE}
.nodeText{font-size:26px;font-weight:700;fill:#ECF4E7}
.note{font-size:20px;fill:#ABC4B5}
</style>
</defs><rect width="1800" height="1120" fill="#0B1918"/><rect width="1800" height="1120" fill="url(#bg)"/>
