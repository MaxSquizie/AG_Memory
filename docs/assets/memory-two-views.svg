<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="ttl desc">
<title id="ttl">Два способа обращения к одним и тем же знаниям</title>
<desc id="desc">Слева показан поиск близких фрагментов текста: он возвращает записи, которые затем интерпретирует языковая модель. Справа показана АГ-память: два исходных утверждения связаны с формальным выводом и его основаниями.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#345347" stroke-width=".6" opacity=".28"/></pattern>
  <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".7" fill="#c5d3b5" opacity=".13"/><circle cx="7" cy="7" r=".55" fill="#c5d3b5" opacity=".1"/></pattern>
  <linearGradient id="rightPanel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#213e32"/><stop offset="1" stop-color="#183329"/></linearGradient>
  <linearGradient id="ink" x1="0" x2="1"><stop stop-color="#E5EBD8"/><stop offset="1" stop-color="#AFD4B4"/></linearGradient>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#B7D69A" stroke-width="1.5"/></marker>
</defs>
<rect width="1600" height="840" fill="#101f1b"/>
<rect width="1600" height="840" fill="url(#grid)"/>
<rect width="1600" height="840" fill="url(#grain)"/>
<path d="M0 0H1600V9H0Z" fill="#B6CF97"/>
<circle cx="1508" cy="118" r="142" fill="none" stroke="#4b7058" stroke-width="1.2" opacity=".52"/>
<circle cx="1508" cy="118" r="115" fill="none" stroke="#4b7058" stroke-width="1.2" opacity=".52"/>
<circle cx="1508" cy="118" r="89" fill="none" stroke="#4b7058" stroke-width="1.2" opacity=".52"/>
<path d="M1420 200L1585 35M1426 44L1590 198" stroke="#4b7058" opacity=".45"/>
<text x="72" y="61" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#A7C69F" letter-spacing="5">AG / MEMORY</text>
<text x="1528" y="61" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="end" fill="#809D8F" letter-spacing="2">ИЛЛЮСТРАЦИЯ 01     /     ПАМЯТЬ И ВЫВОД</text>
<text x="72" y="141" font-family="Arial,Helvetica,sans-serif" font-size="59" font-weight="700" fill="url(#ink)">Один вопрос. Два устройства памяти.</text>
<text x="75" y="189" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#B7C5B8">Исходные знания: «Каждый студент изучает математику» и «Алексей — студент».</text>
<!-- left: snippets as physical strips, not modular pipeline -->
<rect x="70" y="239" width="649" height="509" rx="4" fill="#1A2925" stroke="#52675b" stroke-width="1.5"/>
<text x="102" y="282" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#90A69A" letter-spacing="3">01   /   ПОИСК ПО ЗАПИСЯМ</text>
<path d="M103 307H687" stroke="#52675b"/>
<g transform="rotate(-2 382 380)">
  <path d="M112 337H660L652 451H119Z" fill="#D8D7C8"/>
  <path d="M112 337H660" stroke="#f0eadd" stroke-width="4" opacity=".65"/>
  <text x="140" y="368" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#747D71">ЗАПИСЬ 01</text>
  <text x="140" y="411" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#23342F">Каждый студент изучает</text>
  <text x="140" y="440" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#23342F">математику.</text>
</g>
<g transform="rotate(2 380 500)">
  <path d="M126 469H668L659 546H114Z" fill="#B7C9B2"/>
  <text x="148" y="494" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#697B6C">ЗАПИСЬ 02</text>
  <text x="148" y="533" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e392e">Алексей — студент.</text>
</g>
<path d="M140 570C226 602 291 617 355 627" fill="none" stroke="#759485" stroke-width="2" stroke-dasharray="6 9"/>
<path d="M500 569C442 597 422 602 395 627" fill="none" stroke="#759485" stroke-width="2" stroke-dasharray="6 9"/>
<circle cx="372" cy="631" r="32" fill="#243c33" stroke="#A6B8A4" stroke-width="4"/>
<path d="M395 654L423 682" stroke="#A6B8A4" stroke-width="8" stroke-linecap="round"/>
<text x="458" y="615" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#E9EBD9" font-weight="700">Найдены фрагменты</text>
<text x="458" y="646" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#A4B8A9">Дальше их смысл</text>
<text x="458" y="673" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#A4B8A9">интерпретирует модель.</text>
<!-- seam / illustrated dividing mark -->
<path d="M765 245L746 300L765 351L746 404L765 465L746 517L765 572L746 626L765 715" fill="none" stroke="#869B83" stroke-width="2" stroke-dasharray="3 12" opacity=".7"/>
<rect x="728" y="464" width="52" height="52" rx="26" fill="#101F1B" stroke="#b8cda8" stroke-width="1.6"/>
<text x="754" y="496" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#cbdab9">≠</text>
<!-- right: structured paths, sources, proof with organic topology -->
<rect x="791" y="239" width="739" height="509" rx="4" fill="url(#rightPanel)" stroke="#7B9C7B" stroke-width="1.5"/>
<path d="M819 308H1498" stroke="#6b8a6a"/>
<text x="827" y="282" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#AFCFA4" letter-spacing="3">02   /   СВЯЗАННЫЕ УТВЕРЖДЕНИЯ</text>
<!-- source papers are traces attached to nodes -->
<text x="828" y="358" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#BFD0BA" letter-spacing="2">ОСНОВАНИЕ 01</text>
<text x="828" y="389" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#EFF0E0" font-weight="700">∀x: студент(x) → изучает(x, математику)</text>
<path d="M830 404H1465" stroke="#527561"/>
<text x="828" y="455" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#BFD0BA" letter-spacing="2">ОСНОВАНИЕ 02</text>
<text x="828" y="486" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#EFF0E0" font-weight="700">студент(Алексей)</text>
<!-- line logic as paper annotation: rooted paths -->
<circle cx="1435" cy="382" r="11" fill="#D3B777" stroke="#FADE95" stroke-width="2"/>
<circle cx="1435" cy="483" r="11" fill="#A4C9B5" stroke="#D7EBD0" stroke-width="2"/>
<path d="M1435 393 C1435 461 1392 513 1295 559" fill="none" stroke="#D3B777" stroke-width="3" marker-end="url(#arr)"/>
<path d="M1435 494 C1398 531 1352 545 1295 559" fill="none" stroke="#A4C9B5" stroke-width="3"/>
<circle cx="1290" cy="566" r="11" fill="#E9A978" stroke="#FFE1AA" stroke-width="3"/>
<path d="M1290 581C1290 594 1287 601 1279 611" fill="none" stroke="#E9A978" stroke-width="3"/>
<path d="M833 596C999 607 1059 606 1180 611" fill="none" stroke="#47745d" stroke-width="1"/>
<rect x="823" y="610" width="669" height="106" fill="#E6EAD5" rx="3"/>
<path d="M823 610V716" stroke="#D6AE6B" stroke-width="8"/>
<text x="844" y="642" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#5D6D5D" letter-spacing="2">ВЫВОД  /  НА ОСНОВАНИИ 01 + 02</text>
<text x="844" y="686" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#183B2F">Алексей изучает математику.</text>
<!-- bottom folio -->
<text x="74" y="795" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#99B2A0">Поиск возвращает записи. Формальная память сохраняет и связи между ними.</text>
<text x="1526" y="795" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="end" letter-spacing="2" fill="#719083">AG / 01 — 2026</text>
</svg>