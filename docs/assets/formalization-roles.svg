<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="713" viewBox="0 0 1800 713" role="img" aria-labelledby="ttl des"><title id="ttl">Токенизация и морфология</title><desc id="des">Схема T0 R1 T1 TD для фразы о запрете разрешения на открытие шлюза</desc><defs><marker id="gr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" stroke="#187853" stroke-width="1.5" fill="none"/></marker><marker id="gy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" stroke="#64776e" stroke-width="1.5" fill="none"/></marker></defs><rect width="1800" height="713" fill="#f8fbf9"/><text x="64" y="82" fill="#22332e" font-size="40" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >От исходной строки к структурным кандидатам</text><text x="64" y="125" fill="#64776e" font-size="23" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >Диапазоны, лексические варианты и связи — до утверждения факта.</text><rect x="53" y="174" width="498" height="495" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><rect x="580" y="174" width="582" height="495" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><rect x="1191" y="174" width="557" height="495" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><text x="81" y="222" fill="#187853" font-size="28" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >T0  /  Токены</text><text x="608" y="222" fill="#187853" font-size="28" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >R1 + T1  /  Морфология</text><text x="1219" y="222" fill="#187853" font-size="28" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >TD  /  Структура</text><rect x="77" y="257" width="215" height="86" rx="9" fill="#e2f4e9" stroke="#c7d8cf" stroke-width="1.6"/><text x="90" y="291" fill="#22332e" font-size="23" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >не</text><text x="90" y="324" fill="#64776e" font