ns-serif" >Пробелы и пунктуация также учтены.</text><text x="608" y="264" fill="#22332e" font-size="22" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >не</text><text x="800" y="264" fill="#64776e" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >частица; кандидат NOT</text><path d="M607 282H1136" fill="none" stroke="#c7d8cf" stroke-width="1"  /><text x="608" y="327" fill="#22332e" font-size="22" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >разрешила</text><text x="800" y="327" fill="#64776e" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >разрешить; глагол, прош. вр., ж. р.</text><path d="M607 345H1136" fill="none" stroke="#c7d8cf" stroke-width="1"  /><text x="608" y="390" fill="#22332e" font-size="22" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >роботу</text><text x="800" y="390" fill="#64776e" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >робот; дат. п., ед. ч.</text><path d="M607 408H1136" fill="none" stroke="#c7d8cf" stroke-width="1"  /><text x="608" y="453" fill="#22332e" font-size="22" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >Кай-7</text><text x="800" y="453" fill="#64776e" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >исходная форма KEEP_AS_IS</text><path d="M607 471H1136" fill="none" stroke="#c7d8cf" stroke-width="1"  /><text x="608" y="516" fill="#22332e" font-size="22" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >открыть</text><text x="800" y="516" fill="#64776e" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >открыть; инфинитив</text><path d="M607 534H1136" fill="none" stroke="#c7d8cf" stroke-width="1"  /><text x="608" y="579" fill="#22332e" font-size="22" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >шлюз</text><text x="800" y="579" fill="#64776e" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >им. / вин. п., ед. ч.</text><rect x="1235" y="256" width="210" height="63" rx="9" fill="#e2f4e9" stroke="#9acdb1" stroke-width="2"/><text x="1270" y="296" fill="#187853" font-size="25" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >не  →  NOT</text><rect x="1235" y="374" width="270" height="66" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><text x="1255" y="416" fill="#22332e" font-size="25" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >разрешила</text><rect x="1235" y="501" width="270" height="66" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><text x="1270" y="544" fill="#22332e" font-size="25" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >открыть</text><path d="M1338 320V369" fill="none" stroke="#187853" stroke-width="3" marker-end="url(#gr)" /><path d="M1370 442V495" fill="none" stroke="#64776e" stroke-width="2" marker-end="url(#gy)" /><text x="1520" y="414" fill="#64776e" font-size="20" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >главный</text><text x="1520" y="441" fill="#64776e" font-size="20" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >предикат</text><text x="1520" y="537" fill="#64776e" font-size="20" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >вложенный</text><text x="1520" y="563" fill="#64776e" font-size="20" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >предикат</text><text x="1216" y="633" fill="#64776e" font-size="20" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >Привязки пока локальны.</text></svg>