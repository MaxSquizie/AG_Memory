<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="350" viewBox="0 0 1328 350" role="img" aria-labelledby="t d"><title id="t">Этапы обработки фразы от исходного текста до записи в память</title><desc id="d">Упрощённая концептуальная схема. Все переходы требуют соответствующих ресурсов и проверок.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#478E71" stroke-width="1.5"/></marker></defs><rect width="1328" height="350" fill="#F7FAF8"/><text x="45" y="57" font-size="31" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">Один ввод → последовательные представления</text><rect x="35" y="104" width="232" height="150" rx="12" fill="#EAF5ED" stroke="#B6CBC0" stroke-width="2"/><text x="49" y="145" font-size="20" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">Исходная строка</text><text x="49" y="182" font-size="18" font-weight="700" fill="#327D5D" font-family="DejaVu Sans,Arial,sans-serif">T0 / SRL</text><text x="49" y="220" font-size="16" font-weight="400" fill="#596E63" font-family="DejaVu Sans,Arial,sans-serif">текст, токены, границы</text><path d="M270 179 L285 179" stroke="#478E71" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><rect x="288" y="104" width="232" height="150" rx="12" fill="#FFFFFF" stroke="#B6CBC0" stroke-width="2"/><text x="302" y="145" font-size="20" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">Структура фразы</text><text x="302" y="182" font-size="18" font-weight="700" fill="#327D5D" font-family="DejaVu Sans,Arial,sans-serif">T1 / TD / T2 / TP</text><text x="302" y="220" font-size="15" font-weight="400" fill="#596E63" font-family="DejaVu Sans,Arial,sans-serif">упоминания, связи, рамка</text><path d="M523 179 L538 179" stroke="#478E71" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><rect x="541" y="104" width="232" height="150" rx="12" fill="#EAF5ED" stroke="#B6CBC0" stroke-width="2"/><text x="555" y="145" font-size="20" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">Значения</text><text x="555" y="182" font-size="18" font-weight="700" fill="#327D5D" font-family="DejaVu Sans,Arial,sans-serif">seal / T3 / T4</text><text x="555" y="220" font-size="16" font-weight="400" fill="#596E63" font-family="DejaVu Sans,Arial,sans-serif">смыслы, ограничения, исход</text><path d="M776 179 L791 179" stroke="#478E71" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><rect x="794" y="104" width="232" height="150" rx="12" fill="#FFFFFF" stroke="#B6CBC0" stroke-width="2"/><text x="808" y="145" font-size="18" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">Каноническая привязка</text><text x="808" y="182" font-size="18" font-weight="700" fill="#327D5D" font-family="DejaVu Sans,Arial,sans-serif">IR / C</text><text x="808" y="220" font-size="16" font-weight="400" fill="#596E63" font-family="DejaVu Sans,Arial,sans-serif">план, ссылки на память</text><path d="M1029 179 L1044 179" stroke="#478E71" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><rect x="1047" y="104" width="232" height="150" rx="12" fill="#EAF5ED" stroke="#B6CBC0" stroke-width="2"/><text x="1061" y="145" font-size="20" font-weight="700" fill="#173C30" font-family="DejaVu Sans,Arial,sans-serif">Запись</text><text x="1061" y="182" font-size="18" font-weight="700" fill="#327D5D" font-family="DejaVu Sans,Arial,sans-serif">T5 / T6</text><text x="1061" y="220" font-size="16" font-weight="400" fill="#596E63" font-family="DejaVu Sans,Arial,sans-serif">журнал, поддержанные узлы</text><text x="43" y="308" font-size="19" font-weight="400" fill="#596E63" font-family="DejaVu Sans,Arial,sans-serif">При неоднозначности или недостающих ресурсах запись может не состояться.</text></svg>