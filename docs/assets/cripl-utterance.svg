<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="398" viewBox="0 0 1100 398" role="img" aria-labelledby="title desc"><title id="title">Исходная фраза и морфологические кандидаты</title><desc id="desc">Три выделенных диапазона относятся к неизменённому тексту. Для «Я» указаны лицо и число; для «твой» — проверка согласования; для «Крипл» сохраняется исходное написание.</desc><defs><marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#267653" stroke-width="2" stroke-linejoin="round"/></marker><marker id="grey-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#55645C" stroke-width="2" stroke-linejoin="round"/></marker><marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8F632A" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect width="1100" height="398" fill="#F7F6F1"/>
