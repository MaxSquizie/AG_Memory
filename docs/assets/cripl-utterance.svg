<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 645" width="1500" height="645" role="img" aria-labelledby="tit desc">
<title id="tit">Смысловые части представления Крипл</title><desc id="desc">Приветствие, местоимение первого лица, обращение к адресату, роль и имя</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#388264" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#9DB0A8" stroke-width="1.5"/></marker></defs>
<rect width="1500" height="645" fill="#F7F9F7"/>
<rect x="24" y="24" width="1452" height="597" rx="22" fill="white" stroke="#D8E5DE" stroke-width="2"/>
<text x="70" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="700" fill="#273B33" >Одна реплика — несколько смысловых связей</text><text x="70" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#53695F" >Разбор учитывает роль каждого фрагмента в сообщении.</text><rect x="66" y="175" width="1373" height="112" rx="14" fill="#F3F8F4" stroke="#DAE7DF" stroke-width="2"/><rect x="71" y="194" width="206" height="72" rx="10" fill="#E5F2E9" stroke="#8FC3A2" stroke-width="2"/><text x="80" y="242" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" fill="#246C4A" >Привет,</text><rect x="297" y="194" width="77" height="72" rx="10" fill="#FCFFFD" stroke="#E0ECE4" stroke-width="2"/><text x="306" y="242" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" fill="#23392F" >Я</text><rect x="446" y="194" width="165" height="72" rx="10" fill="#FCFFFD" stroke="#E0ECE4" stroke-width="2"/><text x="455" y="242" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" fill="#23392F" >твой</text><rect x="646" y="194" width="365" height="72" rx="10" fill="#FCFFFD" stroke="#E0ECE4" stroke-width="2"/><text x="655" y="242" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#23392F" >ИИ ассистент</text><rect x="1043" y="194" width="211" height="72" rx="10" fill="#FCFFFD" stroke="#E0ECE4" stroke-width="2"/><text x="1052" y="242" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" fill="#23392F" >Крипл!</text><text x="395" y="241" font-family="DejaVu Sans,Arial,sans-serif" font-size="43" font-weight="700" fill="#273B33" >-</text><path d="M171 287V320L192.5 364" fill="none" stroke="#388264" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="68" y="366" width="249" height="132" rx="11" fill="#E8F4EB" stroke="#9FCFAE" stroke-width="2"/><text x="86" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#273B33" >Привет</text><text x="86" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5C756A" >приветствие</text><path d="M332.5 287V320L458 364" fill="none" stroke="#A9B9B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="337" y="366" width="242" height="132" rx="11" fill="#FFFFFF" stroke="#C7D7CE" stroke-width="2"/><text x="355" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#273B33" >Я</text><text x="355" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5C756A" >ссылка на автора</text><path d="M525.5 287V320L736.5 364" fill="none" stroke="#A9B9B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="599" y="366" width="275" height="132" rx="11" fill="#FFFFFF" stroke="#C7D7CE" stroke-width="2"/><text x="617" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#273B33" >твой</text><text x="617" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5C756A" >связь с адресатом</text><path d="M825.5 287V320L1041 364" fill="none" stroke="#A9B9B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="894" y="366" width="294" height="132" rx="11" fill="#FFFFFF" stroke="#C7D7CE" stroke-width="2"/><text x="912" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#273B33" >ИИ-ассистент</text><text x="912" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5C756A" >названная роль</text><path d="M1145.5 287V320L1332 364" fill="none" stroke="#A9B9B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="1208" y="366" width="248" height="132" rx="11" fill="#FFFFFF" stroke="#C7D7CE" stroke-width="2"/><text x="1226" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#273B33" >Крипл</text><text x="1226" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#5C756A" >названное имя</text><text x="70" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#466C5B" >Источник реплики определяет, к кому относится «я».</text><text x="70" y="601" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#53695F" >Сведения о роли и имени сохраняются с указанием, кто их сообщил.</text>
</svg>