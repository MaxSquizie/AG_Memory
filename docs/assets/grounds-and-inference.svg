<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="739" viewBox="0 0 1800 739" role="img" aria-labelledby="ttl des"><title id="ttl">Структура памяти и поддержка отрицания</title><desc id="des">N-разрешение и N-открытие находятся в структуре под утвержденным корнем NOT</desc><defs><marker id="gr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" stroke="#187853" stroke-width="1.5" fill="none"/></marker><marker id="gy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" stroke="#64776e" stroke-width="1.5" fill="none"/></marker></defs><rect width="1800" height="739" fill="#f8fbf9"/><text x="59" y="76" fill="#22332e" font-size="40" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >Каноническая структура после T6</text><text x="59" y="116" fill="#64776e" font-size="22" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >Корневое отрицание утверждено. Операнды и вложенное действие — структурные.</text><rect x="57" y="170" width="345" height="143" rx="13" fill="#eff7f2" stroke="#96bfaa" stroke-width="2"/><text x="79" y="216" fill="#187853" font-size="27" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >Основание O</text><text x="79" y="258" fill="#22332e" font-size="23" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >«...не разрешила... »</text><rect x="485" y="177" width="325" height="129" rx="13" fill="#e2f4e9" stroke="#5baa80" stroke-width="3"/><text x="513" y="230" fill="#187853" font-size="31" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >G · NOT</text><text x="513" y="270" fill="#64776e" font-size="20" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >есть поддержка факта</text><rect x="887" y="177" width="370" height="129" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><text x="910" y="227" fill="#22332e" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >N · РАЗРЕШИТЬ</text><text x="910" y="269" fill="#64776e" font-size="22" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >только структура</text><rect x="1330" y="177" width="407" height="129" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><text x="1353" y="227" fill="#22332e" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >N · ОТКРЫТЬ</text><text x="1353" y="269" fill="#64776e" font-size="22" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >вложенное содержание</text><path d="M406 240H476" fill="none" stroke="#187853" stroke-width="3" marker-end="url(#gr)" /><path d="M815 240H879" fill="none" stroke="#64776e" stroke-width="2" marker-end="url(#gy)" /><path d="M1261 240H1321" fill="none" stroke="#64776e" stroke-width="2" marker-end="url(#gy)" /><text x="418" y="164" fill="#187853" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >поддержка</text><text x="819" y="163" fill="#64776e" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >операнд</text><text x="1278" y="163" fill="#64776e" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >аргумент</text><rect x="60" y="455" width="371" height="110" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><text x="83" y="500" fill="#22332e" font-size="27" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >M · Ирина</text><text x="83" y="537" fill="#64776e" font-size="21" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >диспетчер</text><rect x="487" y="455" width="371" height="110" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><text x="510" y="500" fill="#22332e" font-size="27" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >M · Кай-7</text><text x="510" y="537" fill="#64776e" font-size="21" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >робот</text><rect x="914" y="455" width="371" height="110" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><text x="937" y="500" fill="#22332e" font-size="27" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >M · шлюз</text><text x="937" y="537" fill="#64776e" font-size="21" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >объект действия</text><rect x="1341" y="455" width="371" height="110" rx="13" fill="#fff" stroke="#c7d8cf" stroke-width="2"/><text x="1364" y="500" fill="#22332e" font-size="27" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >M · «Орион»</text><text x="1364" y="537" fill="#64776e" font-size="21" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" >станция</text><path d="M990 312C955 403 330 386 257 450" fill="none" stroke="#64776e" stroke-width="2" marker-end="url(#gy)" /><path d="M1070 310C1040 383 755 404 669 450" fill="none" stroke="#64776e" stroke-width="2" marker-end="url(#gy)" /><path d="M1544 310C1491 413 1250 415 1111 450" fill="none" stroke="#64776e" stroke-width="2" marker-end="url(#gy)" /><path d="M1615 310C1625 379 1598 420 1575 450" fill="none" stroke="#64776e" stroke-width="2" marker-end="url(#gy)" /><rect x="60" y="625" width="1677" height="74" rx="10" fill="#f0f7f2" stroke="#b0d2bf" stroke-width="2"/><text x="86" y="671" fill="#187853" font-size="24" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >O поддерживает только G(NOT, P).</text><text x="782" y="671" fill="#22332e" font-size="24" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" >N(P) не становится утверждённым фактом.</text></svg>